<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Préstamos | Biblioteca</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav>
  <strong>BIBLIOTECA</strong>
  <a href="/">Inicio</a>
  <a href="/libros">Libros</a>
  <a href="/usuarios">Usuarios</a>
  <a href="/prestamos">Préstamos</a>
</nav>

<main class="container">

  <h1>Préstamos</h1>
  <p class="subtitle">Historial de préstamos de la biblioteca</p>

  <table>

    <thead>
    <tr>
      <th>ID</th>
      <th>Usuario</th>
      <th>Libro</th>
      <th>Fecha préstamo</th>
      <th>Fecha devolución</th>
      <th>Estado</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="prestamo : ${prestamos}">
      <td th:text="${prestamo.id}"></td>
      <td th:text="${prestamo.usuario.nombre}"></td>
      <td th:text="${prestamo.libro.titulo}"></td>
      <td th:text="${prestamo.fechaPrestamo}"></td>

      <td th:text="${prestamo.fechaDevolucion != null
                      ? prestamo.fechaDevolucion
                      : '-'}">
      </td>

      <td th:text="${prestamo.devuelto ? 'Devuelto' : 'Activo'}"></td>
    </tr>

    </tbody>

  </table>

</main>

</body>
</html>
