<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Libro | Biblioteca</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container">

  <h1 th:text="${libro.id == null ? 'Nuevo libro' : 'Editar libro'}"></h1>
  <p class="subtitle">Información del libro</p>

  <div class="form-card">

    <form th:action="@{/admin/libros/guardar}"
          th:object="${libro}"
          method="post">

      <ul class="error" th:if="${#fields.hasErrors('*')}"><li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li></ul>
      <input type="hidden" th:field="*{id}">

      <div class="form-group">
        <label>Título</label>
        <input type="text"
               th:field="*{titulo}"
               required>
      </div>

      <div class="form-group">
        <label>Autor</label>
        <input type="text"
               th:field="*{autor}"
               required>
      </div>

      <div class="form-group">
        <label>ISBN</label>
        <input type="text"
               th:field="*{isbn}">
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" th:field="*{disponible}">
          Disponible
        </label>
      </div>

      <div class="form-actions">
        <button class="btn" type="submit">
          Guardar
        </button>

        <a class="btn btn-secondary" href="/admin/libros">
          Cancelar
        </a>
      </div>

    </form>

  </div>

</main>

</body>
</html>
