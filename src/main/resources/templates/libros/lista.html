<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Libros | Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav>
    <strong>BIBLIOTECA</strong>
    <a href="/">Inicio</a>
    <a href="/libros">Libros</a>
    <a href="/usuarios">Usuarios</a>
    <a href="/prestamos">Préstamos</a>
</nav>

<main class="container">

    <div class="page-header">
        <div>
            <h1>Libros</h1>
            <p class="subtitle">Gestión del catálogo de la biblioteca</p>
        </div>

        <a class="btn" href="/libros/nuevo">
            + Nuevo libro
        </a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>ISBN</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="libro : ${libros}">
            <td th:text="${libro.id}"></td>
            <td th:text="${libro.titulo}"></td>
            <td th:text="${libro.autor}"></td>
            <td th:text="${libro.isbn}"></td>

            <td th:text="${libro.disponible ? 'Disponible' : 'No disponible'}"></td>

            <td>
                <div class="actions">

                    <a class="btn btn-secondary"
                       th:href="@{/libros/editar/{id}(id=${libro.id})}">
                        Editar
                    </a>

                    <a class="btn btn-danger"
                       th:href="@{/libros/eliminar/{id}(id=${libro.id})}">
                        Eliminar
                    </a>

                </div>
            </td>
        </tr>
        </tbody>
    </table>

</main>

</body>
</html>
