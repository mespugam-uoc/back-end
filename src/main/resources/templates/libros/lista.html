<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Libros | Biblioteca</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container">

    <div class="page-header">
        <div>
            <h1>Libros</h1>
            <p class="subtitle">Gestión del catálogo de la biblioteca</p>
        </div>

        <a th:if="${esAdmin}" class="btn" href="/admin/libros/nuevo">
            + Nuevo libro
        </a>
    </div>

    <p role="alert" class="error" th:if="${error}" th:text="${error}"></p>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Autor</th>
            <th>ISBN</th>
            <th>Estado</th>
            <th th:if="${esAdmin}">Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="libro : ${libros}">
            <td th:text="${libro.id}"></td>
            <td th:text="${libro.titulo}"></td>
            <td th:text="${libro.autor}"></td>
            <td th:text="${libro.isbn}"></td>

            <td th:text="${libro.disponible ? 'Disponible' : 'No disponible'}"></td>

            <td th:if="${esAdmin}">
                <div class="actions">

                    <a class="btn btn-secondary"
                       th:href="@{/admin/libros/editar/{id}(id=${libro.id})}">
                        Editar
                    </a>

                    <form th:action="@{/admin/libros/eliminar/{id}(id=${libro.id})}" method="post"><button type="submit" class="btn btn-danger">Eliminar</button></form>

                </div>
            </td>
        </tr>
        </tbody>
    </table>

</main>

</body>
</html>
