<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Usuarios | Biblioteca</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="container">

  <h1>Usuarios</h1>
  <p class="subtitle">Usuarios registrados en la biblioteca</p>

  <table>

    <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Email</th>
      <th>Fecha de registro</th><th>Rol</th><th>Activo</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="usuario : ${usuarios}">
      <td th:text="${usuario.id}"></td>
      <td th:text="${usuario.nombre}"></td>
      <td th:text="${usuario.email}"></td>
      <td th:text="${usuario.fechaRegistro}"></td><td th:text="${usuario.rol}"></td><td th:text="${usuario.activo ? 'Sí' : 'No'}"></td>
    </tr>

    </tbody>

  </table>

</main>

</body>
</html>
